title: "Starry Cloud ✨"
subtitle: "A cozy home for my self-hosted apps"

# Number of proxy layers in front of this app that should be trusted for
# forwarded client IP/protocol headers. Use 0 when running directly, 1 when
# behind one reverse proxy (for example, Nginx/Caddy/Traefik/Cloudflare),
# and increase only if you intentionally chain multiple trusted proxies.
trusted_proxy_hops: 0

login_protection:
  # Limit failed password attempts per client IP.
  login_max_attempts: 3
  login_window_seconds: 300
  login_lockout_seconds: 900

# Optional full-page background image. When set, the dashboard switches to a
# frosted-glass look and the light/dark theme toggle is disabled.
# bg_image_url: "https://example.com/wallpaper.jpg"
# Blur the background image (frosted look stays regardless of this option).
# bg_image_blur: false

# Optional footer text, replacing "Powered by <device model>".
# footer: "My homelab"

# Address ranges treated as "on the private network" (default: Tailscale's
# 100.64.0.0/10 and fd7a:115c:a1e0::/48). The visitor's address is read the same
# way as for login protection, so set trusted_proxy_hops to match your proxies.
# A visitor inside these ranges sees "via Tailscale"; anyone else "via Internet".
# tailnet_cidrs:
#   - "100.64.0.0/10"
#   - "fd7a:115c:a1e0::/48"

# Available services to show on the dashboard. Order matters.
# `url` is the single https/http address used both to open the service and to
# check its online status. `icon_url` links a PNG (or other image) icon shown
# on the card; omit it to fall back to a placeholder. Set `tailnet_only: true` for
# services only reachable over the private network: visitors outside
# `tailnet_cidrs` see them dimmed and not clickable, with a "Tailscale only" tag
# (the status dot still works, since checks run on the server).
services:
  - name: "Service One"
    url: "https://service-one.example.com"
    icon_url: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/adguard-home-central-manager.png"
    description: "Replace with your first service"

  - name: "Service Two"
    url: "https://service-two.example.com"
    icon_url: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/adguard-home.png"
    description: "Replace with your second service"

  - name: "Service Three"
    url: "https://service-three.example.com"
    icon_url: "https://cdn.jsdelivr.net/gh/selfhst/icons@main/png/jellyfin.png"
    description: "Replace with your third service"

  - name: "Private Service"
    url: "https://private.example.com"
    description: "Only reachable over Tailscale"
    tailnet_only: true
